<!--
  SECTION "KENAPA PILIH EVERGLO" (VERSI RINGAN) — Smile Planner.
  UI 100% sama seperti versi asal. Perubahan:
  1. Ikon Font Awesome (<i class="fa-solid ...">) diganti dengan SVG inline — path asal
     dari Font Awesome Free 6 (CC BY 4.0, https://fontawesome.com/license/free).
     Section ini tidak lagi bergantung pada fail all.min.css + webfont FA.
  2. Style baris yang berulang 6 kali dipindah ke class (.sp-why-row) — HTML lebih kecil.
  3. content-visibility: auto — browser skip kerja render section ni sehingga user
     scroll hampir kepadanya (tiada perubahan visual).
  Masih guna CSS variables dari template utama (.evg-smile-planner).
-->

<style>
  .sp-why-section {
    background: var(--white);
    content-visibility: auto;
    contain-intrinsic-size: auto 620px;
  }

  .sp-why-row {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--grey);
    border-radius: 18px;
    padding: 22px;
  }

  .sp-why-row p {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.45;
    color: var(--navy);
  }

  .sp-why-ico {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: var(--mint);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sp-why-ico svg {
    height: 16px;
    width: auto;
    fill: currentColor;
    display: block;
  }
</style>
