<!--
  SECTION "REVIEW GOOGLE" / 3 KOLUM SCROLL (VERSI RINGAN) — Smile Planner.
  UI 100% sama seperti versi asal — 3 kolum bergerak atas/bawah, pause bila hover,
  bintang, avatar, nama & masa. Perubahan:
  1. Kolum review HANYA dibina bila user scroll hampir ke section (IntersectionObserver,
     600px awal) — sebelum tu, TIADA satu pun daripada 26 avatar di-request.
     (Versi asal bina semua terus masa page load, tanpa lazy loading.)
  2. Semua avatar dapat loading="lazy" + decoding="async" + width/height 44 — layout
     stabil dan decode tak block main thread. Kad duplikat untuk gelung animasi
     ditanda aria-hidden (screen reader tak baca dua kali); URL sama = guna cache.
  3. content-visibility: auto pada wrapper — browser skip kerja render + animasi
     sehingga hampir viewport.
  4. Animasi dihormati prefers-reduced-motion (pause), sama macam section hero.

  NOTA: avatar dipaparkan hanya 44x44px. Jika fail PNG asal besar, guna URL saiz
  "Thumbnail" 150px dari Media Library (suffix -150x150.png) dalam senarai data.
-->

<style>
.tc-wrap{display:flex;gap:16px;height:460px;overflow:hidden;position:relative;max-width:1100px;margin:0 auto;content-visibility:auto;contain-intrinsic-size:auto 460px}
.tc-wrap::before,.tc-wrap::after{content:"";position:absolute;left:0;right:0;height:60px;z-index:2;pointer-events:none}
.tc-wrap::before{top:0;background:linear-gradient(#fff,transparent)}
.tc-wrap::after{bottom:0;background:linear-gradient(transparent,#fff)}
.tc-col{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.tc-col.up .tc-track{animation:tc-up 32s linear infinite}
.tc-col.down .tc-track{animation:tc-down 36s linear infinite}
.tc-wrap:hover .tc-track{animation-play-state:paused}
.tc-track{display:flex;flex-direction:column;gap:16px}
.tc-card{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.6;color:#444;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow-wrap:break-word;word-break:break-word}
.tc-stars{color:#f5a623;font-size:14px;letter-spacing:2px;margin-bottom:8px;white-space:nowrap}
.tc-name{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:14px;min-width:0}
.tc-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#eef2ff}
.tc-nm{font-size:13px;font-weight:600;color:#111;overflow-wrap:break-word;word-break:break-word;line-height:1.3}
.tc-role{font-size:12px;color:#888}
@keyframes tc-up{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
@keyframes tc-down{0%{transform:translateY(-50%)}100%{transform:translateY(0)}}
@media(max-width:1024px){.tc-wrap{height:420px;gap:12px}}
@media(max-width:768px){.tc-wrap{height:380px;gap:8px}.tc-card{padding:14px 12px;font-size:12.5px}.tc-stars{letter-spacing:1px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.tc-track{animation-play-state:paused!important}}
</style>

<div class="tc-wrap" id="tc"></div>

function card(d,hidden){
  const c=document.createElement("div");c.className="tc-card";
  if(hidden)c.setAttribute("aria-hidden","true");
  c.innerHTML=`<div class="tc-stars">★★★★★</div><div>${d.text}</div><div class="tc-name"><img class="tc-avatar" src="${d.img}" alt="${hidden?"":d.name}" width="44" height="44" loading="lazy" decoding="async" onerror="this.style.display='none'"><div class="tc-nm">${d.name}</div><div class="tc-role">${d.time}</div></div>`;
  return c;
}

const wrap=document.getElementById("tc");
if(!wrap)return;
let built=false;

function build(){
  if(built)return;
  built=true;
  const colCount=3;
  const cols=[[],[],[]];
  data.forEach((item,i)=>cols[i%colCount].push(item));
  cols.forEach((items,i)=>{
    const colEl=document.createElement("div");colEl.className="tc-col "+(i%2===0?"up":"down");
    const track=document.createElement("div");track.className="tc-track";
    items.forEach(d=>track.appendChild(card(d,false)));
    /* Duplikat untuk gelung animasi — URL sama = cache, aria-hidden supaya tak dibaca dua kali */
    items.forEach(d=>track.appendChild(card(d,true)));
    colEl.appendChild(track);wrap.appendChild(colEl);
  });
}

if('IntersectionObserver' in window){
  const io=new IntersectionObserver(function(ent){
    if(ent[0].isIntersecting){build();io.disconnect();}
  },{rootMargin:'600px 0px'});
  io.observe(wrap);
}else{
  build();
}
})();
</script>
