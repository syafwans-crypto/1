<!--
  SECTION "GALERI" (VERSI RINGAN) — Smile Planner.
  UI 100% sama seperti versi asal. Perubahan:
  1. Ikon Font Awesome pada badge GALERI diganti SVG inline (path asal FA6, CC BY 4.0).
  2. Style tile gambar yang berulang 10 kali dipindah ke class (.sp-gal-tile) —
     HTML mengecil lebih 60%.
  3. Semua gambar dapat decoding="async" + width/height (kekal loading="lazy").
  4. content-visibility: auto — browser skip kerja render + decode 10 gambar
     sehingga user scroll hampir ke section ini.
  Class hover sp-hover-13 hingga sp-hover-22 kekal — definisinya dalam template utama.

  NOTA PENJIMATAN TERBESAR (perlu buat manual dalam WordPress):
  10 gambar galeri guna fail saiz penuh sedangkan tile dipaparkan hanya ~190-280px.
  Salin URL saiz "Medium" 300px dari Media Library (suffix seperti -300x300.jpg)
  dan ganti src setiap gambar — boleh jimat beberapa MB pada section ini sahaja.
  Perhatian khas: IMG_2951-1.png & IMG_2953.png ialah PNG (paling berat) — versi
  JPG/Medium jauh lebih kecil.
-->

<style>
  .sp-gal-section {
    background: var(--sky);
    content-visibility: auto;
    contain-intrinsic-size: auto 900px;
  }

  .sp-gal-tile {
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1/1;
    box-shadow: 0 8px 22px rgba(15, 47, 68, 0.08);
  }

  .sp-gal-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 400ms ease;
  }

  .sp-gal-badge-ico {
    height: 0.9em;
    width: auto;
    fill: currentColor;
    display: inline-block;
    vertical-align: -0.05em;
  }
</style>

          GALERI
        </span>
        <h2 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.65rem,4vw,2.5rem); line-height: 1.15; letter-spacing: -0.01em; color: var(--navy);">Galeri Klinik Pergigian Everglo</h2>

      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 44px;">

        <div class="sp-gal-tile"><img src="https://klinikpergigianeverglo.com/wp-content/uploads/2025/12/68f5b174-860a-4cda-b248-1f74bb733314.jpg" alt="Galeri Everglo" class="sp-hover-20" width="280" height="280" loading="lazy" decoding="async"></div>
        <div class="sp-gal-tile"><img src="https://klinikpergigianeverglo.com/wp-content/uploads/2025/12/bbe2b515-4ce5-421b-9da4-56e97785e2ec.jpg" alt="Galeri Everglo" class="sp-hover-21" width="280" height="280" loading="lazy" decoding="async"></div>
        <div class="sp-gal-tile"><img src="https://klinikpergigianeverglo.com/wp-content/uploads/2025/12/photo_2025-09-03_11-18-06-5.jpg" alt="Galeri Everglo" class="sp-hover-22" width="280" height="280" loading="lazy" decoding="async"></div>
